<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div id="calculator">
     <input type="text" id="display" readonly>
     <div class="button-container">

     <button class="button" onclick="curreentValue='';
     document.querySelector('#display').value =curreentValue"
     >C</button>

     <button class="button" onclick="curreentValue=curreentValue+'1';
     document.querySelector('#display').value =curreentValue">1</button>

     <button class="button" onclick="curreentValue=curreentValue+'2';
     document.querySelector('#display').value =curreentValue">2</button>

     <button class="button" onclick="curreentValue=curreentValue+'3';
     document.querySelector('#display').value =curreentValue">3</button>

     <button class="button" onclick="curreentValue=curreentValue+'4';
     document.querySelector('#display').value =curreentValue">4</button>

     <button class="button" onclick="curreentValue=curreentValue+'5';
     document.querySelector('#display').value =curreentValue">5</button>

     <button class="button" onclick="curreentValue=curreentValue+'6';
     document.querySelector('#display').value =curreentValue">6</button>

     <button class="button" onclick="curreentValue=curreentValue+'7';
     document.querySelector('#display').value =curreentValue">7</button>

     <button class="button"onclick="curreentValue=curreentValue+'+';
     document.querySelector('#display').value = curreentValue">+</button>

     <button class="button" onclick="curreentValue=curreentValue+'8';
     document.querySelector('#display').value =curreentValue">8</button>

     <button class="button" onclick="curreentValue=curreentValue+'9';
     document.querySelector('#display').value =curreentValue">9</button>

     <button class="button" onclick="curreentValue=curreentValue+'-';
     document.querySelector('#display').value =curreentValue">-</button>

     <button class="button" onclick="result=eval(curreentValue);
     document.querySelector('#display').value =result">=</button>

     <button class="button" onclick="curreentValue=curreentValue+'/';
     document.querySelector('#display').value =curreentValue">/</button>

     <button class="button" onclick="curreentValue=curreentValue+'*';
     document.querySelector('#display').value =curreentValue">x</button>
     </div>
   
    </div>

    <script>
        let curreentValue = ''
        document.querySelector('#display').value =curreentValue
    </script>
    
</body>
</html>
